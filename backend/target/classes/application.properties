spring.application.name=second-wind

spring.datasource.url=jdbc:postgresql://localhost:5433/second_wind
spring.datasource.username=postgres
spring.datasource.password=1939
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 1. Root level activation properties (Must match what the starter scans for)
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com

# 2. Specific chat completion routing configurations for Google's path structure
spring.ai.openai.chat.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions

# 3. Model Engine Target
spring.ai.openai.chat.options.model=gemini-1.5-flash